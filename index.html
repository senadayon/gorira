<canvas id="sky"></canvas>
<div id="hint">click anywhere to launch a firework 🎆 — then edit the code and press Run</div>

<style>
  body  { margin: 0; background: #060613; overflow: hidden; }
  #sky  { position: fixed; left: 0; top: 0; }
  #hint { position: fixed; bottom: 14px; width: 100%; text-align: center;
          color: #8b93b8; font: 14px/1.4 system-ui, sans-serif; user-select: none; }
</style>

<script>
// ═══════════ PLAY WITH THESE ═══════════
var COLORS    = ['#ff3b6b', '#ffd166', '#06d6a0', '#4cc9f0', '#c77dff'];
var PARTICLES = 900;    // sparks per firework (try 300!)
var GRAVITY   = 0.06;  // how hard the sparks fall (try -0.02...)
var AUTO_MS   = 900;   // auto-launch every X milliseconds
// ═══════════════════════════════════════

var canvas = document.getElementById('sky');
var ctx = canvas.getContext('2d');

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize);
resize();

var sparks = [];

function boom(x, y) {
  var color = COLORS[Math.floor(Math.random() * COLORS.length)];
  for (var i = 0; i < PARTICLES; i++) {
    var angle = (Math.PI * 2 * i) / PARTICLES;
    var speed = 2 + Math.random() * 4;
    sparks.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 60 + Math.random() * 40,
      color: color
    });
  }
}

function tick() {
  // translucent background = glowing trails (try 0.5 for short trails)
  ctx.fillStyle = 'rgba(6, 6, 19, 0.18)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.globalCompositeOperation = 'lighter';
  for (var i = sparks.length - 1; i >= 0; i--) {
    var s = sparks[i];
    s.x += s.vx;
    s.y += s.vy;
    s.vy += GRAVITY;
    s.vx *= 0.985;
    s.vy *= 0.985;
    s.life--;
    ctx.globalAlpha = Math.max(s.life / 100, 0);
    ctx.fillStyle = s.color;
    ctx.fillRect(s.x, s.y, 3, 3);
    if (s.life <= 0) sparks.splice(i, 1);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(tick);
}
tick();

addEventListener('pointerdown', function (e) { boom(e.clientX, e.clientY); });

setInterval(function () {
  boom(innerWidth  * (0.15 + Math.random() * 0.7),
       innerHeight * (0.15 + Math.random() * 0.5));
}, AUTO_MS);

boom(innerWidth / 2, innerHeight / 2.5);
</script>
